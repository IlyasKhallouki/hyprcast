[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyprcast"
version = "0.2.0"
description = "Private Hyprland-only fork of fluxcast: stream this desktop to a Miracast sink over Wi-Fi Display"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "IlyaP358"},
]
# Standard library only. Every third-party dependency the upstream project
# carried (upnpclient, pychromecast, dbus-next, Pillow, pystray, pygobject)
# belonged to the DLNA, Cast, tray or xdg-desktop-portal backends, all of
# which this fork deletes.
requires-python = ">=3.13"
dependencies = []
keywords = [
    "miracast", "wfd", "wireless-display", "screen-cast",
    "hyprland", "wayland", "vaapi", "linux",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: System :: Networking",
]

[project.scripts]
hyprcast = "main:main"

[tool.hatch.build.targets.wheel]
sources = {"src" = ""}
include = [
    "src/*.py",
    "src/drivers/",
]

# No force-include: meta/fluxcast.desktop launched the deleted tray
# (Exec=fluxcast --tray) and is not shipped. meta/install.sh still installs the
# wpa-supplicant drop-in for anyone provisioning the machine by hand.

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "engine/",
    "meta/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
